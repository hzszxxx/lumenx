family: xiangongyun
display_name: "仙宫云 (Xiangongyun)"
provider: xiangongyun
routing_prefixes:
  - xiangongyun/
  - xiangongyun-
  - h3-
  - h3/
supported_backends:
  - vendor
default_backend: vendor
backend_env_key: XIANGONGYUN_PROVIDER_MODE
credential_sources:
  vendor:
    - XIANGONGYUN_ACCESS_TOKEN
supported_modalities:
  - i2v
  - r2v
transport:
  image_input_mode:
    vendor: xiangongyun_vendor_image_url
  audio_input_mode:
    vendor: xiangongyun_vendor_audio_url
  reference_video_input_mode:
    vendor: xiangongyun_vendor_video_url
docs:
  official_snapshot_ids:
    - xiangongyun/2026-11-24
  repo_local_snapshot_paths:
    - docs/1-api-reference/xiangongyun-h3.md
models:
  - id: xiangongyun/h3-video
    display_name: 仙宫云 H3
    description: 仙宫云自部署 MiniMax H3 量化版，支持音画对白生成
    status: active
    release_stage: stable
    capabilities: [i2v, r2v]
    runtime:
      vendor:
        gateway: xiangongyun
    docs:
      repo_local_snapshot_paths:
        - docs/1-api-reference/xiangongyun-h3.md
    modes:
      i2v:
        legacy_id: xiangongyun-h3-i2v
        display_name: 仙宫云 H3 I2V
        description: 仙宫云自部署 H3 图生视频 (首帧驱动·音画一体)
        capabilities: [i2v]
        runtime:
          vendor:
            api_model_id: xiangongyun-h3-i2v
            gateway: xiangongyun
        ui:
          selection_group: i2v
          visible_in: [project_settings, series_settings, video_sidebar, global_settings]
          order: 95
          badges: [new, self-hosted]
        duration:
          type: slider
          min: 3
          max: 15
          step: 1
          default: 5
        params:
          resolution:
            options: [768p, 1080p]
            default: 768p
          audio:
            default: true
          seed:
            min: -1
            max: 2147483647
          negativePrompt: true
          promptExtend: false
        inputs:
          reference_images:
            max: 1
            reference_type: image
      r2v:
        legacy_id: xiangongyun-h3-r2v
        display_name: 仙宫云 H3 R2V
        description: 仙宫云自部署 H3 多参考图角色对白视频生成
        capabilities: [r2v]
        runtime:
          vendor:
            api_model_id: xiangongyun-h3-r2v
            gateway: xiangongyun
        ui:
          selection_group: r2v
          visible_in: [project_settings, series_settings, video_sidebar, global_settings]
          order: 75
          badges: [new, self-hosted]
        duration:
          type: slider
          min: 3
          max: 15
          step: 1
          default: 5
        params:
          resolution:
            options: [768p, 1080p]
            default: 768p
          aspectRatio:
            options: ["16:9", "9:16", "1:1"]
            default: "16:9"
          audio:
            default: true
          seed:
            min: -1
            max: 2147483647
          negativePrompt: true
          promptExtend: false
        inputs:
          reference_images:
            max: 9
            reference_type: image
